name: Build image

on:
  push:
    branches:
      - main

env:
  IMAGE: salle-hemu

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up docker build
        uses: docker/setup-buildx-action@v3

      - name: login into registry
        uses: docker/login-action@v3
        with:
          username: fabreantoine
          password: ${{ secrets.TOKEN_REGISTRY }}

      - name: find new version
        id: version
        run: |
          VERSION=$(grep '"version":' package.json | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            echo "Failed to find version in package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: salle-hemu
          tags: |
            fabreantoine/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            fabreantoine/${{ env.IMAGE }}:latest
